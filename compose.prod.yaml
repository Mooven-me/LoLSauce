# compose.prod.yaml
# Production environment override
services:
  php:
    build:
      target: frankenphp_prod
      args:
        DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=${MYSQL_VERSION:-8}&charset=${MYSQL_CHARSET:-utf8mb4}
        MERCURE_URL: ${MERCURE_URL:-http://php/.well-known/mercure}
        MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
        MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-80}/.well-known/mercure}

    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
  lolsauce-node:
    build:
      target: react_prod
  
  lolsauce-phpmyadmin:
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "true"