# compose.prod.yaml
# Production environment override
services:
  php:
    build:
      target: frankenphp_prod
    env_file:
      - .env
      - .env.prod
    volumes:
      - ./supervisord:/etc/supervisor
      - ./.env:/app/.env
      - caddy_data:/data
      - caddy_config:/config

  lolsauce-node:
    build:
      target: react_prod
    env_file:
      - .env
      - .env.prod
    volumes : []
  
  lolsauce-phpmyadmin:
    env_file:
      - .env
      - .env.prod

  database:
    env_file:
      - .env
      - .env.prod