# compose.prod.yaml
# Production environment override
services:
  php:
    build:
      target: frankenphp_prod
    env_file:
      - .env
      - .env.prod
    volumes:
      - /app/vendor

  lolsauce-node:
    build:
      target: react_prod
    env_file:
      - .env
      - .env.prod

  lolsauce-phpmyadmin:
    env_file:
      - .env
      - .env.prod

  database:
    env_file:
      - .env
      - .env.prod