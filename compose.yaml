# compose.yml
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php
    restart: unless-stopped
    build:
      dockerfile: symfony/Dockerfile
      target: frankenphp_dev
    env_file:
      - .env
    volumes:
      - ./supervisord:/etc/supervisor
      - ./.env:/app/.env
      - caddy_data:/data
      - caddy_config:/config
      - ./symfony:/app
      - /app/vendor
      - ./symfony/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./symfony/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    ports:
      # HTTP
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      # HTTPS
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      # HTTP/3
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    extra_hosts:
      - host.docker.internal:host-gateway

  ###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      # You should definitely change the password in production in the .env.prod file 
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_USER: ${MYSQL_USER:-app}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./database:/var/lib/mysql:rw
    ports:
      - "3306"
  ###< doctrine/doctrine-bundle ###

  lolsauce-phpmyadmin: 
    image: phpmyadmin
    environment:
      PMA_HOST: database
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    ports:
      - "8080:80"
    depends_on:
      - database

  lolsauce-node:
    ports:
      - "5173:5173"
    build:
      context: ./front
    volumes:
      - ./symfony/public/build:/app/dist
      - ./front:/app
      - /app/node_modules
    working_dir: /app
    tty: true


volumes:
  caddy_data:
  caddy_config: